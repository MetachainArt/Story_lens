services:
  db:
    image: postgres:16-alpine
    container_name: storylens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: story_lens
      POSTGRES_USER: storylens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in deploy/.env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storylens -d story_lens"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: storylens-api:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: storylens-api
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  init:
    image: storylens-api:local
    container_name: storylens-init
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - alembic upgrade head && python -m scripts.seed_ai_defaults
    depends_on:
      db:
        condition: service_healthy

  retention-cleanup:
    image: storylens-api:local
    container_name: storylens-retention-cleanup
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/app/uploads
    command:
      - sh
      - -c
      - while true; do python -m scripts.purge_expired_photos; sleep $${PHOTO_RETENTION_SWEEP_SECONDS:-21600}; done
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: storylens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: storylens-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  pgdata:
  uploads:
  certbot-etc:
  certbot-var:
  certbot-webroot:
