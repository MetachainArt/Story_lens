# --- Existing storylens config ---

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name api.storylens.dmssolution.co.kr hermes.dmssolution.co.kr;

    # Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - storylens API
server {
    listen 443 ssl;
    http2 on;
    server_name api.storylens.dmssolution.co.kr;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    set $upstream http://api:8000;

    ssl_certificate /etc/letsencrypt/live/api.storylens.dmssolution.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.storylens.dmssolution.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 30M;
    }
}

# HTTPS - dms.Lab (hermes)
server {
    listen 443 ssl;
    http2 on;
    server_name hermes.dmssolution.co.kr;

    ssl_certificate /etc/letsencrypt/live/hermes.dmssolution.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes.dmssolution.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Proxy to dms.Lab
    location / {
        proxy_pass http://172.17.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    # Static file caching
    location /static/ {
        proxy_pass http://172.17.0.1:8788;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    client_max_body_size 20M;
}
