# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name api.storylens.dmssolution.co.kr;

    # Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name api.storylens.dmssolution.co.kr;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    set $upstream http://api:8000;

    ssl_certificate /etc/letsencrypt/live/api.storylens.dmssolution.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.storylens.dmssolution.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 10M;
    }
}
